# CodeRabbit 설정
# 목적: PR 요약 자동화
# 스키마 참고: https://docs.coderabbit.ai/reference/configuration

language: "ko-KR"

reviews:
  profile: chill
  high_level_summary: true

  # 요약을 PR description 대신 comments에 작성
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    이 PR의 변경사항을 사람이 빠르게 이해할 수 있도록 요약

    다음 형식으로 작성:

    ## 변경 요약
    - 핵심 변경사항을 3~7개의 bullet point로 작성
    - 구현 세부사항보다 "무엇이 왜 변경되었는지"에 집중
    - 파일 단위의 단순 나열을 피할 것

    ## 영향 범위
    - API, DB, UI, 비즈니스 로직, 인프라 등에 어떤 영향이 있는지 작성
    - 영향이 없다면 "특이사항 없음"이라고 작성

    ## 리뷰 포인트
    - 사람이 리뷰할 때 특히 확인하면 좋은 부분만 1~5개 작성
    - 단순한 스타일 지적이나 사소한 개선사항은 작성하지 말 것
    - 확실하지 않은 내용을 추측해서 작성하지 말 것

    전체적으로 짧고 명확하게 작성

  # 리뷰 자체는 최대한 가볍게 진행
  request_changes_workflow: false

  # Walkthrough
  collapse_walkthrough: true
  changed_files_summary: true

  # 필요 없는 부가 정보 끄기
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false  

  # 자동 리뷰
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - "dev"
      - "main"

  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/*.min.js"
    - "!**/generated/**"

chat:
  auto_reply: true
