# 저장소 로컬 Codex 설정.
#
# AGENTS.md를 기본 지침 문서로 둔다. 이 설정은 Codex가 중첩 지침을
# 읽을 때 지침 체인이 잘리지 않도록 여유를 늘리고, 모듈별 worker
# 권한 profile을 한곳에서 관리한다.

project_doc_max_bytes = 65536

# 기본은 읽기 전용으로 시작한다.
# 전체 권한이 필요하면 built-in `:danger-full-access`를 명시적으로 선택한다.
default_permissions = ":read-only"

[permissions.apps-realtime-chat-worker]
description = "apps/realtime-chat 모듈 안에서만 작업하고, 저장소 루트 문맥은 읽기 전용으로 사용한다."

[permissions.apps-realtime-chat-worker.filesystem]
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
# Codex 런타임 경로 가시성 우회 설정. 플랫폼/설치 방식에 따라 일부
# 경로는 없을 수 있다. ~/.codex 전체는 열지 않고 필요한 후보만 좁게 연다.
"~/.codex/packages/standalone" = "read"
"~/.codex/.sandbox-bin" = "read"
"~/AppData/Local/OpenAI/Codex/bin" = "read"

[permissions.apps-realtime-chat-worker.filesystem.":workspace_roots"]
"." = "read"
"apps" = "deny"
"packages" = "deny"
"node_modules" = "deny"
".idea" = "deny"
"apps/realtime-chat" = "write"

[permissions.packages-realtime-chat-worker]
description = "packages/realtime-chat 모듈 안에서만 작업하고, 저장소 루트 문맥은 읽기 전용으로 사용한다."

[permissions.packages-realtime-chat-worker.filesystem]
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
# Codex 런타임 경로 가시성 우회 설정. 플랫폼/설치 방식에 따라 일부
# 경로는 없을 수 있다. ~/.codex 전체는 열지 않고 필요한 후보만 좁게 연다.
"~/.codex/packages/standalone" = "read"
"~/.codex/.sandbox-bin" = "read"
"~/AppData/Local/OpenAI/Codex/bin" = "read"

[permissions.packages-realtime-chat-worker.filesystem.":workspace_roots"]
"." = "read"
"apps" = "deny"
"packages" = "deny"
"node_modules" = "deny"
".idea" = "deny"
"packages/realtime-chat" = "write"
