services:
  realtime-chat-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ./apps/realtime-chat-api/docker/postgres.dev.env
    ports:
      - "127.0.0.1:${REALTIME_CHAT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - realtime-chat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  realtime-chat-redis:
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REALTIME_CHAT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

volumes:
  realtime-chat-postgres-data:

networks:
  internal:
    internal: true
